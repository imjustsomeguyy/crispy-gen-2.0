<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3A3A3A">

<title>Barcode Generator</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
:root {
  --bg: #3A3A3A;
  --card: #4A4A4A;
  --card-dark: #333333;
  --input: #3A3A3A;
  --border: #5B5B5B;
  --border-light: #6C6C6C;
  --text: #F2F2F2;
  --muted: #A9A9A9;

  /* Default accent */
  --accent: #8B2028;
  --accent-bright: #D92838;
  --accent-rgb: 217, 40, 56;

  --danger: #ff5967;
  --barcode-bg: #ffffff;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 28px 15px 100px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  color: var(--text);

  background:
    radial-gradient(
      circle at 50% -10%,
      #6C6C6C 0%,
      #4A4A4A 30%,
      #3A3A3A 65%,
      #303030 100%
    );

  transition:
    background 0.3s ease,
    color 0.3s ease;
}

.app {
  width: min(520px, 100%);
  margin: auto;
}

/* =========================
   HEADER
========================= */

.header {
  text-align: center;
  margin-bottom: 22px;
}

.header h1 {
  margin: 0;

  font-size: 25px;
  letter-spacing: -0.5px;

  text-shadow:
    0 0 12px rgba(var(--accent-rgb), 0.35);
}

.header p {
  margin: 7px 0 0;

  color: var(--muted);
  font-size: 13px;
}

/* =========================
   TOP BAR
========================= */

.top-bar {
  display: flex;
  justify-content: flex-end;

  position: relative;

  margin-bottom: 9px;
}

.accent-button {
  width: 31px;
  height: 31px;

  padding: 0;

  border: 1px solid var(--border-light);
  border-radius: 9px;

  background: #3A3A3A;

  cursor: pointer;

  position: relative;

  box-shadow:
    0 0 8px rgba(var(--accent-rgb), 0.25);

  transition:
    transform 0.15s ease,
    box-shadow 0.2s ease;
}

.accent-button:hover {
  transform: scale(1.06);

  box-shadow:
    0 0 14px rgba(var(--accent-rgb), 0.65);
}

.accent-dot {
  width: 12px;
  height: 12px;

  position: absolute;
  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background: var(--accent-bright);

  box-shadow:
    0 0 5px var(--accent-bright),
    0 0 12px var(--accent-bright);
}

/* =========================
   ACCENT PICKER
========================= */

.accent-menu {
  position: absolute;

  top: 39px;
  right: 0;

  z-index: 100;

  width: 190px;

  padding: 12px;

  border: 1px solid var(--border-light);
  border-radius: 13px;

  background: #3A3A3A;

  box-shadow:
    0 15px 45px rgba(0,0,0,0.55),
    0 0 20px rgba(var(--accent-rgb),0.12);

  display: none;

  animation: menuIn 0.15s ease;
}

.accent-menu.open {
  display: block;
}

.accent-menu-title {
  color: var(--muted);

  font-size: 10px;
  font-weight: 700;

  text-transform: uppercase;
  letter-spacing: 0.8px;

  margin-bottom: 9px;
}

.colour-grid {
  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 8px;
}

.colour-choice {
  width: 32px;
  height: 32px;

  padding: 0;

  border: 2px solid transparent;
  border-radius: 9px;

  cursor: pointer;

  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease;
}

.colour-choice:hover {
  transform: scale(1.12);
}

.colour-choice.selected {
  border-color: white;

  box-shadow:
    0 0 7px currentColor,
    0 0 14px currentColor;
}

@keyframes menuIn {
  from {
    opacity: 0;
    transform: translateY(-4px) scale(0.97);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* =========================
   GENERATOR
========================= */

.generator-card {
  background: #4A4A4A;

  border: 1px solid var(--border-light);
  border-radius: 20px;

  padding: 20px;

  box-shadow:
    0 25px 60px rgba(0,0,0,0.35),
    inset 0 1px rgba(255,255,255,0.035);
}

.field {
  margin-bottom: 16px;
}

label {
  display: block;

  margin-bottom: 7px;

  color: #B8B8B8;

  font-size: 10px;
  font-weight: 750;

  letter-spacing: 0.8px;
  text-transform: uppercase;
}

input {
  width: 100%;
  height: 46px;

  border: 1px solid var(--border-light);
  border-radius: 11px;

  outline: none;

  background: var(--input);
  color: var(--text);

  padding: 0 13px;

  font-size: 15px;

  transition:
    border-color 0.15s,
    box-shadow 0.15s;
}

input::placeholder {
  color: #858585;
}

input:focus {
  border-color: var(--accent-bright);

  box-shadow:
    0 0 0 3px rgba(var(--accent-rgb), 0.12),
    0 0 14px rgba(var(--accent-rgb), 0.12);
}

.code-row {
  display: flex;
  gap: 8px;
}

.code-row input {
  flex: 1;
}

.scan-button {
  width: 48px;
  height: 46px;

  flex-shrink: 0;

  border: 1px solid var(--border-light);
  border-radius: 11px;

  background: #3A3A3A;

  font-size: 21px;

  cursor: pointer;

  transition:
    transform 0.15s ease,
    box-shadow 0.2s ease;
}

.scan-button:hover {
  transform: scale(1.04);

  box-shadow:
    0 0 12px rgba(var(--accent-rgb),0.35);
}

/* =========================
   PRICE BUTTONS
========================= */

.price-buttons {
  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 7px;
}

.price-button {
  height: 43px;

  border: 1px solid var(--border);
  border-radius: 10px;

  background: #3A3A3A;
  color: var(--text);

  font-size: 14px;
  font-weight: 650;

  cursor: pointer;

  transition:
    border-color 0.15s,
    box-shadow 0.2s,
    background 0.15s;
}

.price-button:hover {
  border-color: var(--accent-bright);

  box-shadow:
    0 0 10px rgba(var(--accent-rgb),0.2);
}

.price-button.active {
  border-color: var(--accent-bright);

  background:
    rgba(var(--accent-rgb),0.16);

  color: #ffffff;

  box-shadow:
    0 0 10px rgba(var(--accent-rgb),0.28),
    inset 0 0 10px rgba(var(--accent-rgb),0.06);
}

#customPriceContainer {
  display: none;

  margin-top: 10px;
}

#price {
  width: 100%;
}

/* =========================
   GENERATE
========================= */

.generate-button {
  width: 100%;
  height: 48px;

  margin-top: 4px;

  border: 1px solid var(--accent-bright);
  border-radius: 12px;

  background: var(--accent);

  color: #ffffff;

  font-size: 15px;
  font-weight: 800;

  cursor: pointer;

  box-shadow:
    0 0 8px rgba(var(--accent-rgb),0.35),
    0 7px 25px rgba(var(--accent-rgb),0.12);

  transition:
    background 0.15s,
    transform 0.15s,
    box-shadow 0.2s;
}

.generate-button:hover {
  background: var(--accent-bright);

  transform: translateY(-1px);

  box-shadow:
    0 0 14px rgba(var(--accent-rgb),0.65),
    0 9px 30px rgba(var(--accent-rgb),0.2);
}

.error {
  display: none;

  margin: 0 0 12px;

  color: var(--danger);

  font-size: 13px;
}

/* =========================
   SAVED BARCODES
========================= */

.saved-title {
  margin: 28px 0 10px;

  color: var(--muted);

  font-size: 10px;
  font-weight: 750;

  letter-spacing: 1px;

  text-align: center;
  text-transform: uppercase;
}

.empty {
  padding: 28px 15px;

  border: 1px dashed var(--border-light);
  border-radius: 17px;

  text-align: center;

  color: var(--muted);

  font-size: 13px;
}

.barcode-list {
  display: flex;

  flex-direction: column;

  gap: 13px;
}

.barcode-card {
  overflow: hidden;

  border: 1px solid var(--border-light);
  border-radius: 18px;

  background: #4A4A4A;

  box-shadow:
    0 12px 30px rgba(0,0,0,0.28),
    inset 0 1px rgba(255,255,255,0.025);
}

.barcode-card-header {
  padding: 14px 16px 9px;

  text-align: center;
}

.barcode-label {
  font-size: 15px;
  font-weight: 700;
}

.barcode-data {
  margin-top: 3px;

  color: #999999;

  font-size: 11px;
}

.barcode-frame {
  margin: 0 12px;

  padding: 15px 10px;

  border-radius: 13px;

  background: var(--barcode-bg);

  text-align: center;
}

.barcode-frame svg {
  display: block;

  width: 100%;
  max-width: 430px;

  height: auto;

  margin: auto;
}

.barcode-footer {
  display: flex;

  justify-content: center;

  padding: 10px 15px 14px;
}

.delete-button {
  border: 1px solid var(--border-light);
  border-radius: 9px;

  background: #3A3A3A;

  color: #ff5967;

  padding: 7px 13px;

  font-size: 12px;

  cursor: pointer;
}

.delete-button:hover {
  box-shadow:
    0 0 10px rgba(255,89,103,0.2);
}

/* =========================
   FLOATING +
========================= */

.floating-add {
  position: fixed;

  right: 22px;
  bottom: 22px;

  z-index: 50;

  width: 56px;
  height: 56px;

  border: 1px solid var(--accent-bright);
  border-radius: 50%;

  background: var(--accent);

  color: #ffffff;

  font-size: 29px;
  font-weight: 300;

  cursor: pointer;

  box-shadow:
    0 0 10px rgba(var(--accent-rgb),0.45),
    0 12px 30px rgba(0,0,0,0.45);

  transition:
    transform 0.15s,
    box-shadow 0.2s;
}

.floating-add:hover {
  transform: scale(1.07);

  box-shadow:
    0 0 18px rgba(var(--accent-rgb),0.75),
    0 12px 30px rgba(0,0,0,0.45);
}

/* =========================
   SCANNER
========================= */

.scanner-overlay {
  position: fixed;

  inset: 0;

  z-index: 9999;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 14px;

  background: rgba(0,0,0,0.84);

  backdrop-filter: blur(8px);
}

.scanner-overlay.open {
  display: flex;
}

.scanner-modal {
  width: min(520px, 100%);

  overflow: hidden;

  border: 1px solid #6C6C6C;
  border-radius: 20px;

  background: #3A3A3A;

  box-shadow:
    0 30px 90px rgba(0,0,0,0.75);
}

.scanner-header {
  display: flex;

  justify-content: space-between;
  align-items: flex-start;

  gap: 15px;

  padding: 17px;
}

.scanner-header h2 {
  margin: 0;

  font-size: 18px;
}

.scanner-header p {
  margin: 5px 0 0;

  color: #A9A9A9;

  font-size: 12px;
}

.scanner-close {
  width: 36px;
  height: 36px;

  border: 1px solid #5B5B5B;
  border-radius: 10px;

  background: #4A4A4A;

  color: #ddd;

  font-size: 25px;

  cursor: pointer;
}

.scanner-close:hover {
  background: #5B5B5B;
}

/*
 IMPORTANT:
 This is deliberately a real visible camera viewport.
*/
.scanner-camera-container {
  position: relative;

  width: calc(100% - 24px);
  height: 330px;

  margin: 0 12px;

  overflow: hidden;

  border-radius: 14px;

  background: #000;

  border: 1px solid #5B5B5B;
}

#barcodeScanner {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;
}

#barcodeScanner video {
  display: block;

  width: 100% !important;
  height: 100% !important;

  object-fit: cover;
}

/*
 Don't hide the camera scan region itself.
*/
#barcodeScanner__scan_region {
  width: 100% !important;
  height: 100% !important;

  border: 0 !important;
}

/*
 Hide only the library controls below the video.
*/
#barcodeScanner__dashboard_section {
  display: none !important;
}

#barcodeScanner__header_message {
  display: none !important;
}

/* Scanner guide */

.scanner-target {
  position: absolute;

  left: 5%;
  right: 5%;

  top: 50%;

  height: 105px;

  transform: translateY(-50%);

  border: 2px solid rgba(255,255,255,0.78);

  border-radius: 10px;

  pointer-events: none;

  box-shadow:
    0 0 0 9999px rgba(0,0,0,0.12);
}

.target-line {
  position: absolute;

  left: 4%;
  right: 4%;

  top: 50%;

  height: 2px;

  background: rgba(255,255,255,0.82);

  box-shadow:
    0 0 8px rgba(255,255,255,0.8);
}

.scanner-status {
  min-height: 20px;

  padding: 12px 17px 6px;

  text-align: center;

  color: #B0B0B0;

  font-size: 13px;
}

.scanner-status.success {
  color: var(--accent-bright);

  font-weight: 750;

  text-shadow:
    0 0 8px rgba(var(--accent-rgb),0.7);
}

.scanner-status.error {
  color: #ff5967;
}

.scanner-tip {
  padding: 5px 17px 16px;

  color: #858585;

  font-size: 11px;

  line-height: 1.4;

  text-align: center;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 430px) {

  body {
    padding-left: 10px;
    padding-right: 10px;
  }

  .generator-card {
    padding: 16px;
  }

  .price-buttons {
    grid-template-columns:
      repeat(2, 1fr);
  }

  .floating-add {
    right: 16px;
    bottom: 16px;
  }

  .scanner-camera-container {
    height: 300px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top-bar">

    <button
      type="button"
      class="accent-button"
      id="accentButton"
      title="Change accent colour"
    >
      <span class="accent-dot"></span>
    </button>

    <div
      class="accent-menu"
      id="accentMenu"
    >
      <div class="accent-menu-title">
        Accent colour
      </div>

      <div
        class="colour-grid"
        id="colourGrid"
      ></div>
    </div>

  </div>

  <div class="header">
    <h1>PLACEHOLDER1</h1>

    <p>
      PLACEHOLDER2
    </p>
  </div>


  <!-- GENERATOR -->

  <div class="generator-card">

    <div class="field">

      <label for="barcodeLabel">
        Label
      </label>

      <input
        type="text"
        id="barcodeLabel"
        placeholder="Add a label to your barcode"
        autocomplete="off"
      >

    </div>


    <div class="field">

      <label for="productCode">
        Product Code
      </label>

      <div class="code-row">

        <input
          type="text"
          id="productCode"
          placeholder="Enter barcode number"
          inputmode="numeric"
          autocomplete="off"
          maxlength="13"
        >

        <button
          type="button"
          id="scanButton"
          class="scan-button"
          title="Scan barcode"
        >
          📷
        </button>

      </div>

    </div>


    <div class="field">

      <label>
        Price
      </label>

      <div class="price-buttons">

        <button
          class="price-button"
          data-price="10"
        >
          10p
        </button>

        <button
          class="price-button"
          data-price="49"
        >
          49p
        </button>

        <button
          class="price-button"
          data-price="100"
        >
          £1
        </button>

        <button
          class="price-button"
          data-price="custom"
        >
          Custom
        </button>

      </div>


      <div id="customPriceContainer">

        <input
          type="number"
          id="price"
          placeholder="Price in pence"
          min="1"
          max="999999"
          inputmode="numeric"
        >

      </div>

    </div>


    <p
      class="error"
      id="error"
    ></p>


    <button
      type="button"
      class="generate-button"
      id="generateButton"
    >
      Generate Barcode
    </button>

  </div>


  <div class="saved-title">
    Saved Barcodes
  </div>


  <div
    id="emptyState"
    class="empty"
  >
    No barcodes generated yet.
  </div>


  <div
    id="barcodeList"
    class="barcode-list"
  ></div>

</div>


<!-- FLOATING PLUS -->

<button
  type="button"
  class="floating-add"
  id="floatingAdd"
  title="New barcode"
>
  +
</button>


<!-- SCANNER -->

<div
  class="scanner-overlay"
  id="scannerOverlay"
>

  <div class="scanner-modal">

    <div class="scanner-header">

      <div>
        <h2>Scan Barcode</h2>

        <p>
          EAN-8 and EAN-13
        </p>
      </div>

      <button
        type="button"
        class="scanner-close"
        id="closeScanner"
      >
        ×
      </button>

    </div>


    <div class="scanner-camera-container">

      <div id="barcodeScanner"></div>

      <div class="scanner-target">
        <div class="target-line"></div>
      </div>

    </div>


    <div
      class="scanner-status"
      id="scannerStatus"
    >
      Starting camera…
    </div>


    <div class="scanner-tip">
      Move closer or further away until the barcode is sharp.
      The scanner continuously retries difficult frames.
    </div>

  </div>

</div>


<script>

/* =========================================================
   ACCENT COLOURS
========================================================= */

const accentColours = [

  {
    main: "#8B2028",
    bright: "#D92838",
    rgb: "217, 40, 56"
  },

  {
    main: "#7A2419",
    bright: "#F04432",
    rgb: "240, 68, 50"
  },

  {
    main: "#8A4B16",
    bright: "#FF8A24",
    rgb: "255, 138, 36"
  },

  {
    main: "#75600D",
    bright: "#E8C51A",
    rgb: "232, 197, 26"
  },

  {
    main: "#39751C",
    bright: "#70E83E",
    rgb: "112, 232, 62"
  },

  {
    main: "#167044",
    bright: "#32E88A",
    rgb: "50, 232, 138"
  },

  {
    main: "#116A6A",
    bright: "#25E0DF",
    rgb: "37, 224, 223"
  },

  {
    main: "#145A86",
    bright: "#28AFFF",
    rgb: "40, 175, 255"
  },

  {
    main: "#273E91",
    bright: "#536FFF",
    rgb: "83, 111, 255"
  },

  {
    main: "#55349B",
    bright: "#965CFF",
    rgb: "150, 92, 255"
  },

  {
    main: "#762C91",
    bright: "#D24CFF",
    rgb: "210, 76, 255"
  },

  {
    main: "#8D2869",
    bright: "#FF4DB8",
    rgb: "255, 77, 184"
  },

  {
    main: "#96304A",
    bright: "#FF4F72",
    rgb: "255, 79, 114"
  },

  {
    main: "#52651A",
    bright: "#B8E631",
    rgb: "184, 230, 49"
  },

  {
    main: "#1E7770",
    bright: "#3DFFD9",
    rgb: "61, 255, 217"
  },

  {
    main: "#5A5A5A",
    bright: "#D5D5D5",
    rgb: "213, 213, 213"
  }

];


const colourGrid =
  document.getElementById("colourGrid");


const accentButton =
  document.getElementById("accentButton");


const accentMenu =
  document.getElementById("accentMenu");


let currentAccent = 0;


function setAccent(index) {

  const colour =
    accentColours[index];

  document.documentElement.style.setProperty(
    "--accent",
    colour.main
  );

  document.documentElement.style.setProperty(
    "--accent-bright",
    colour.bright
  );

  document.documentElement.style.setProperty(
    "--accent-rgb",
    colour.rgb
  );

  currentAccent = index;

  document
    .querySelectorAll(".colour-choice")
    .forEach((button, i) => {

      button.classList.toggle(
        "selected",
        i === index
      );

    });
}


accentColours.forEach(
  (colour, index) => {

    const button =
      document.createElement("button");

    button.type = "button";

    button.className =
      "colour-choice";

    button.style.background =
      colour.bright;

    button.style.color =
      colour.bright;

    button.title =
      "Accent colour " + (index + 1);

    button.addEventListener(
      "click",
      () => {

        setAccent(index);

        accentMenu.classList.remove(
          "open"
        );

      }
    );

    colourGrid.appendChild(button);

  }
);


setAccent(0);


accentButton.addEventListener(
  "click",
  event => {

    event.stopPropagation();

    accentMenu.classList.toggle(
      "open"
    );

  }
);


accentMenu.addEventListener(
  "click",
  event => {

    event.stopPropagation();

  }
);


document.addEventListener(
  "click",
  () => {

    accentMenu.classList.remove(
      "open"
    );

  }
);


/* =========================================================
   PRODUCT CODE LIMIT
========================================================= */

const productCode =
  document.getElementById("productCode");


productCode.addEventListener(
  "input",
  () => {

    productCode.value =
      productCode.value
        .replace(/\D/g, "")
        .slice(0, 13);

  }
);


/* =========================================================
   BARCODE GENERATOR
========================================================= */

function padLeft(str, length) {

  return String(str)
    .padStart(length, "0");

}


function calculateCheckDigit(input) {

  let sum = 0;

  for (
    let i = 0;
    i < input.length;
    i++
  ) {

    const digit =
      parseInt(
        input[input.length - 1 - i],
        10
      );

    const weight =
      (i % 2 === 0)
        ? 3
        : 1;

    sum += digit * weight;

  }

  return (
    10 - (sum % 10)
  ) % 10;

}


let selectedPrice = null;


document
  .querySelectorAll(".price-button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".price-button")
          .forEach(btn => {

            btn.classList.remove(
              "active"
            );

          });


        button.classList.add(
          "active"
        );


        const value =
          button.dataset.price;


        if (value === "custom") {

          selectedPrice = null;

          document
            .getElementById(
              "customPriceContainer"
            )
            .style.display = "block";

        } else {

          selectedPrice =
            Number(value);

          document
            .getElementById("price")
            .value = value;

          document
            .getElementById(
              "customPriceContainer"
            )
            .style.display = "none";

        }

      }
    );

  });


function generateBarcode() {

  const labelInput =
    document.getElementById(
      "barcodeLabel"
    );

  const priceInput =
    document.getElementById(
      "price"
    );

  const error =
    document.getElementById(
      "error"
    );


  const rawProduct =
    productCode.value.trim();


  const label =
    labelInput.value.trim();


  let price;


  if (selectedPrice !== null) {

    price = selectedPrice;

  } else {

    price =
      Number(priceInput.value);

  }


  error.style.display =
    "none";


  const numericProduct =
    rawProduct.replace(
      /\D/g,
      ""
    );


  if (
    !numericProduct ||
    numericProduct.length < 8
  ) {

    error.textContent =
      "Enter a valid product barcode.";

    error.style.display =
      "block";

    return;
  }


  if (
    !Number.isFinite(price) ||
    price < 1
  ) {

    error.textContent =
      "Enter a valid price in pence.";

    error.style.display =
      "block";

    return;
  }


  let productDigits =
    numericProduct.length === 14
      ? numericProduct.slice(0, -1)
      : numericProduct;


  productDigits =
    padLeft(
      productDigits,
      13
    );


  productDigits =
    productDigits.slice(
      0,
      13
    );


  const paddedPrice =
    padLeft(
      price,
      6
    );


  /*
   * The label is NOT part of this.
   */
  const baseNumber =
    `91${productDigits}${paddedPrice}`;


  const checkDigit =
    calculateCheckDigit(
      baseNumber
    );


  const fullBarcode =
    `${baseNumber}${checkDigit}`;


  const id =
    "barcode-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2, 8);


  const card =
    document.createElement(
      "div"
    );

  card.className =
    "barcode-card";


  const header =
    document.createElement(
      "div"
    );

  header.className =
    "barcode-card-header";


  const labelElement =
    document.createElement(
      "div"
    );

  labelElement.className =
    "barcode-label";

  labelElement.textContent =
    label ||
    "Untitled Barcode";


  const dataElement =
    document.createElement(
      "div"
    );

  dataElement.className =
    "barcode-data";

  dataElement.textContent =
    fullBarcode;


  header.appendChild(
    labelElement
  );

  header.appendChild(
    dataElement
  );


  const frame =
    document.createElement(
      "div"
    );

  frame.className =
    "barcode-frame";


  const svg =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "svg"
    );


  frame.appendChild(svg);


  const footer =
    document.createElement(
      "div"
    );

  footer.className =
    "barcode-footer";


  const deleteButton =
    document.createElement(
      "button"
    );

  deleteButton.type =
    "button";

  deleteButton.className =
    "delete-button";

  deleteButton.textContent =
    "Remove";


  deleteButton.addEventListener(
    "click",
    () => {

      card.remove();

      updateEmptyState();

    }
  );


  footer.appendChild(
    deleteButton
  );


  card.appendChild(
    header
  );

  card.appendChild(
    frame
  );

  card.appendChild(
    footer
  );


  document
    .getElementById(
      "barcodeList"
    )
    .prepend(card);


  try {

    JsBarcode(
      svg,
      fullBarcode,
      {

        format: "CODE128",

        displayValue: true,

        fontSize: 16,

        width: 2,

        height: 85,

        margin: 5,

        background: "#ffffff",

        lineColor: "#111111",

        fontOptions: "bold"

      }
    );

  } catch (err) {

    console.error(
      "Barcode rendering error:",
      err
    );

    frame.textContent =
      "Barcode rendering failed.";

  }


  labelInput.value = "";
  productCode.value = "";


  updateEmptyState();


  card.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

}


document
  .getElementById(
    "generateButton"
  )
  .addEventListener(
    "click",
    generateBarcode
  );


/* =========================================================
   PLUS BUTTON
========================================================= */

document
  .getElementById(
    "floatingAdd"
  )
  .addEventListener(
    "click",
    () => {

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });


      setTimeout(
        () => {

          document
            .getElementById(
              "barcodeLabel"
            )

      );

  );


function updateEmptyState() {

  const list =
    document.getElementById(
      "barcodeList"
    );

  const empty =
    document.getElementById(
      "emptyState"
    );


  empty.style.display =
    list.children.length === 0
      ? "block"
      : "none";

}


updateEmptyState();


/* =========================================================
   CAMERA SCANNER
========================================================= */

let barcodeScanner = null;

let scannerRunning = false;

let lastScan = "";

let lastScanTime = 0;


const scanButton =
  document.getElementById(
    "scanButton"
  );


const scannerOverlay =
  document.getElementById(
    "scannerOverlay"
  );


const closeScanner =
  document.getElementById(
    "closeScanner"
  );


const scannerStatus =
  document.getElementById(
    "scannerStatus"
  );


/*
 * Open scanner.
 */
async function openScanner() {

  scannerOverlay.classList.add(
    "open"
  );


  scannerStatus.textContent =
    "Requesting camera…";


  scannerStatus.className =
    "scanner-status";


  await startBarcodeScanner();

}


/*
 * Start camera.
 */
async function startBarcodeScanner() {

  if (scannerRunning) {
    return;
  }


  /*
   * Check that the library actually loaded.
   */
  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    scannerStatus.textContent =
      "Scanner library failed to load.";

    scannerStatus.className =
      "scanner-status error";

    return;
  }


  try {

    barcodeScanner =
      new Html5Qrcode(
        "barcodeScanner"
      );


    const formats = [

      Html5QrcodeSupportedFormats.EAN_13,

      Html5QrcodeSupportedFormats.EAN_8

    ];


    const config = {

      /*
       * 30 FPS gives the decoder
       * plenty of frames.
       */
      fps: 30,


      /*
       * Wide scan area.
       */
      qrbox: function(
        width,
        height
      ) {

        return {

          width:
            Math.floor(
              width * 0.92
            ),

          height:
            Math.floor(
              height * 0.48
            )

        };

      },


      aspectRatio:
        16 / 9,


      formatsToSupport:
        formats,


      experimentalFeatures: {

        useBarCodeDetectorIfSupported:
          true

      }

    };


    /*
     * Ask specifically for the rear camera.
     */
    await barcodeScanner.start(

      {
        facingMode: {
          ideal: "environment"
        }
      },

      config,

      handleBarcodeDetected,

      () => {
        /*
         * Failed frames are ignored.
         * Scanner continuously tries again.
         */
      }

    );


    scannerRunning =
      true;


    scannerStatus.textContent =
      "Camera ready — point it at a barcode.";


    /*
     * Attempt continuous autofocus.
     */
    try {

      const video =
        document.querySelector(
          "#barcodeScanner video"
        );


      if (
        video &&
        video.srcObject
      ) {

        const tracks =
          video.srcObject
            .getVideoTracks();


        if (tracks.length > 0) {

          const track =
            tracks[0];


          if (
            track.getCapabilities
          ) {

            const capabilities =
              track.getCapabilities();


            if (
              capabilities.focusMode &&
              capabilities.focusMode.includes(
                "continuous"
              )
            ) {

              await track.applyConstraints({

                advanced: [

                  {
                    focusMode:
                      "continuous"
                  }

                ]

              });

            }

          }

        }

      }

    } catch (focusError) {

      console.log(
        "Autofocus control unavailable:",
        focusError
      );

    }


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );


    let message =
      "Could not start the camera.";


    /*
     * Give useful errors instead of
     * silently failing.
     */
    if (
      location.protocol !== "https:" &&
      location.hostname !== "localhost"
    ) {

      message =
        "Camera requires HTTPS.";

    } else if (
      error &&
      String(error)
        .toLowerCase()
        .includes("permission")
    ) {

      message =
        "Camera permission was denied. Allow camera access in Safari settings.";

    } else if (
      error &&
      String(error)
        .toLowerCase()
        .includes("notallowed")
    ) {

      message =
        "Camera access was blocked. Allow camera access for this website.";

    } else if (
      error &&
      String(error)
        .toLowerCase()
        .includes("notfound")
    ) {

      message =
        "No camera was found on this device.";

    } else if (error) {

      message =
        "Camera failed: " +
        String(error)
          .replace(
            /^Error:\s*/i,
            ""
          )
          .slice(0, 140);

    }


    scannerStatus.textContent =
      message;

    scannerStatus.className =
      "scanner-status error";


    barcodeScanner =
      null;

    scannerRunning =
      false;

  }

}


/*
 * Barcode detected.
 */
async function handleBarcodeDetected(
  decodedText
) {

  const now =
    Date.now();


  /*
   * Prevent duplicate reads.
   */
  if (
    decodedText === lastScan &&
    now - lastScanTime < 1500
  ) {

    return;

  }


  lastScan =
    decodedText;

  lastScanTime =
    now;


  const digits =
    decodedText.replace(
      /\D/g,
      ""
    );


  /*
   * Only EAN-8 and EAN-13.
   */
  if (
    digits.length !== 8 &&
    digits.length !== 13
  ) {

    return;

  }


  scannerStatus.textContent =
    "✓ Barcode detected";


  scannerStatus.className =
    "scanner-status success";


  /*
   * Put result into the product box.
   */
  productCode.value =
    digits.slice(0, 13);


  await stopBarcodeScanner();


  setTimeout(
    () => {

      scannerOverlay.classList.remove(
        "open"
      );

    },
    250
  );

}


/*
 * Stop camera.
 */
async function stopBarcodeScanner() {

  if (
    !barcodeScanner ||
    !scannerRunning
  ) {

    return;

  }


  try {

    await barcodeScanner.stop();

    barcodeScanner.clear();

  } catch (error) {

    console.log(
      "Scanner cleanup:",
      error
    );

  }


  scannerRunning =
    false;

  barcodeScanner =
    null;

}


/*
 * Close scanner.
 */
async function closeBarcodeScanner() {

  await stopBarcodeScanner();

  scannerOverlay.classList.remove(
    "open"
  );

}


/*
 * Camera button.
 */
scanButton.addEventListener(
  "click",
  openScanner
);


/*
 * X button.
 */
closeScanner.addEventListener(
  "click",
  closeBarcodeScanner
);


/*
 * Tap outside modal.
 */
scannerOverlay.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      scannerOverlay
    ) {

      closeBarcodeScanner();

    }

  }
);


/*
 * Stop camera if user leaves page.
 */
document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.hidden &&
      scannerRunning
    ) {

      stopBarcodeScanner();

    }

  }
);


/*
 * Escape key.
 */
document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape" &&
      scannerOverlay.classList.contains(
        "open"
      )
    ) {

      closeBarcodeScanner();

    }

  }
);

</script>
