<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3A3A3A">
<title>PLACEHOLDER1</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>

<style>
:root{
  --bg:#3A3A3A;
  --card:#4A4A4A;
  --input:#3A3A3A;
  --border:#5B5B5B;
  --border2:#6C6C6C;
  --text:#eee;
  --muted:#aaa;
  --accent:#5B5B5B;
  --bright:#fff;
  --rgb:255,255,255;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:25px 14px 100px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 50% -15%,#6C6C6C 0,#4A4A4A 30%,#3A3A3A 68%,#303030 100%);
}

button,input{font:inherit}

.app{
  width:min(520px,100%);
  margin:auto;
}

.top{
  height:35px;
  display:flex;
  justify-content:flex-end;
  position:relative;
}

.accent-btn{
  width:31px;
  height:31px;
  border:1px solid var(--border2);
  border-radius:9px;
  background:var(--input);
  cursor:pointer;
  box-shadow:0 0 9px rgba(var(--rgb),.3);
}

.accent-dot{
  display:block;
  width:12px;
  height:12px;
  margin:auto;
  border-radius:50%;
  background:var(--bright);
  box-shadow:0 0 5px var(--bright),0 0 13px var(--bright);
}

.palette{
  display:none;
  position:absolute;
  right:0;
  top:39px;
  z-index:20;
  width:190px;
  padding:12px;
  border:1px solid var(--border2);
  border-radius:13px;
  background:#3A3A3A;
  box-shadow:0 18px 50px #0009;
}

.palette.open{display:block}

.palette-title{
  margin-bottom:9px;
  color:var(--muted);
  font-size:10px;
  font-weight:bold;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.colours{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.colour{
  width:32px;
  height:32px;
  padding:0;
  border:2px solid transparent;
  border-radius:9px;
  cursor:pointer;
}

.colour.selected{
  border-color:white;
  box-shadow:0 0 8px currentColor,0 0 14px currentColor;
}

header{
  text-align:center;
  margin-bottom:20px;
}

h1{
  margin:0;
  font-size:25px;
  letter-spacing:-.5px;
  text-shadow:0 0 12px rgba(var(--rgb),.3);
}

header p{
  margin:7px 0 0;
  color:var(--muted);
  font-size:13px;
}

.generator{
  padding:20px;
  border:1px solid var(--border2);
  border-radius:20px;
  background:var(--card);
  box-shadow:0 25px 60px #0005,inset 0 1px #ffffff08;
}

.field{
  margin-bottom:15px;
}

label{
  display:block;
  margin-bottom:7px;
  color:#b8b8b8;
  font-size:10px;
  font-weight:750;
  text-transform:uppercase;
  letter-spacing:.8px;
}

input{
  width:100%;
  height:46px;
  padding:0 13px;
  border:1px solid var(--border2);
  border-radius:11px;
  outline:none;
  background:var(--input);
  color:var(--text);
  font-size:15px;
}

input::placeholder{
  color:#858585;
}

input:focus{
  border-color:var(--bright);
  box-shadow:
    0 0 0 3px rgba(var(--rgb),.12),
    0 0 14px rgba(var(--rgb),.12);
}

.code-row{
  display:flex;
  gap:8px;
}

.code-row input{
  flex:1;
}

.scan{
  width:48px;
  height:46px;
  flex-shrink:0;
  border:1px solid var(--border2);
  border-radius:11px;
  background:var(--input);
  font-size:21px;
  cursor:pointer;
}

.scan:hover{
  box-shadow:0 0 14px rgba(var(--rgb),.35);
}

.prices{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.price{
  height:43px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--input);
  color:var(--text);
  font-weight:650;
  cursor:pointer;
}

.price:hover,
.price.active{
  border-color:var(--bright);
  box-shadow:0 0 11px rgba(var(--rgb),.25);
}

.price.active{
  background:rgba(var(--rgb),.16);
}

#customPrice{
  display:none;
  margin-top:9px;
}

.generate{
  width:100%;
  height:48px;
  margin-top:4px;
  border:1px solid var(--bright);
  border-radius:12px;
  background:var(--accent);
  color:white;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 0 9px rgba(var(--rgb),.4);
}

.generate:hover{
  background:var(--bright);
  box-shadow:0 0 17px rgba(var(--rgb),.7);
}

.error{
  display:none;
  margin:0 0 12px;
  color:#ff5967;
  font-size:13px;
}

.saved-title{
  margin:28px 0 10px;
  color:var(--muted);
  text-align:center;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1px;
  text-transform:uppercase;
}

.empty{
  padding:27px 15px;
  border:1px dashed var(--border2);
  border-radius:17px;
  color:var(--muted);
  text-align:center;
  font-size:13px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.card{
  position:relative;
  overflow:hidden;
  border:1px solid var(--border2);
  border-radius:18px;
  background:var(--card);
  box-shadow:0 12px 30px #0004;
  cursor:pointer;
}

.card-head{
  position:relative;
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:13px 45px 13px 16px;
  text-align:center;
}

.card-head::after{
  content:"⌄";
  position:absolute;
  right:16px;
  font-size:17px;
  color:#999;
  transition:transform .2s;
}

.card.open .card-head::after{
  transform:rotate(180deg);
}

.label{
  font-size:15px;
  font-weight:700;
}

.data{
  margin-top:3px;
  color:#999;
  font-size:11px;
}

.card-content{
  display:none;
}

.card.open .card-content{
  display:block;
}

.frame{
  margin:0 12px;
  padding:15px 10px;
  border-radius:13px;
  background:white;
}

.frame svg{
  display:block;
  width:100%;
  height:auto;
  margin:auto;
}

.card-foot{
  padding:10px 15px 14px;
  text-align:center;
}

.remove{
  padding:7px 13px;
  border:1px solid var(--border2);
  border-radius:9px;
  background:var(--input);
  color:#ff5967;
  font-size:12px;
  cursor:pointer;
}

.plus{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:30;
  width:56px;
  height:56px;
  border:1px solid var(--bright);
  border-radius:50%;
  background:var(--accent);
  color:white;
  font-size:29px;
  cursor:pointer;
  box-shadow:
    0 0 12px rgba(var(--rgb),.5),
    0 12px 30px #0007;
}

.plus:hover{
  transform:scale(1.07);
  box-shadow:
    0 0 20px rgba(var(--rgb),.8),
    0 12px 30px #0007;
}

/* Scanner */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:999;
  align-items:center;
  justify-content:center;
  padding:14px;
  background:#000d;
  backdrop-filter:blur(8px);
}

.overlay.open{
  display:flex;
}

.scanner{
  width:min(520px,100%);
  overflow:hidden;
  border:1px solid var(--border2);
  border-radius:20px;
  background:#3A3A3A;
  box-shadow:0 30px 90px #000;
}

.scanner-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  padding:17px;
}

.scanner-head h2{
  margin:0;
  font-size:18px;
}

.scanner-head p{
  margin:5px 0 0;
  color:#aaa;
  font-size:12px;
}

.close{
  width:36px;
  height:36px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--card);
  color:#ddd;
  font-size:24px;
  cursor:pointer;
}

.camera{
  position:relative;
  width:calc(100% - 24px);
  height:330px;
  margin:0 12px;
  overflow:hidden;
  border-radius:14px;
  background:#000;
  border:1px solid var(--border);
}

#quagga{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#quagga video{
  display:block;
  width:100%!important;
  height:100%!important;
  object-fit:cover;
}

#quagga canvas{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
}

.target{
  position:absolute;
  left:5%;
  right:5%;
  top:50%;
  height:110px;
  transform:translateY(-50%);
  border:2px solid #fff9;
  border-radius:10px;
  pointer-events:none;
  box-shadow:0 0 0 9999px #0002;
}

.target:after{
  content:"";
  position:absolute;
  left:4%;
  right:4%;
  top:50%;
  height:2px;
  background:#fff;
  box-shadow:0 0 8px white;
}

.status{
  min-height:21px;
  padding:12px 17px 5px;
  color:#aaa;
  text-align:center;
  font-size:13px;
}

.status.success{
  color:var(--bright);
  font-weight:bold;
  text-shadow:0 0 9px rgba(var(--rgb),.7);
}

.status.error{
  color:#ff5967;
}

.tip{
  padding:5px 17px 16px;
  color:#858585;
  font-size:11px;
  text-align:center;
}

@media(max-width:430px){
  body{
    padding-left:10px;
    padding-right:10px;
  }

  .generator{
    padding:16px;
  }

  .plus{
    right:16px;
    bottom:16px;
  }

  .camera{
    height:300px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top">

    <button class="accent-btn" id="accentButton">
      <span class="accent-dot"></span>
    </button>

    <div class="palette" id="palette">
      <div class="palette-title">Accent colour</div>
      <div class="colours" id="colours"></div>
    </div>

  </div>

  <header>
    <h1>PLACEHOLDER1</h1>
    <p>PLACEHOLDER2</p>
  </header>

  <main class="generator">

    <div class="field">
      <label>Label</label>

      <input
        id="barcodeLabel"
        type="text"
        placeholder="Add a label to your barcode"
        autocomplete="off"
      >
    </div>

    <div class="field">

      <label>Product Code</label>

      <div class="code-row">

        <input
          id="productCode"
          type="text"
          maxlength="13"
          inputmode="numeric"
          placeholder="Enter barcode number"
          autocomplete="off"
        >

        <button
          class="scan"
          id="scanButton"
          title="Scan barcode"
        >📷</button>

      </div>

    </div>

    <div class="field">

      <label>Price</label>

      <div class="prices">

        <button class="price" data-price="10">
          10p
        </button>

        <button class="price" data-price="49">
          49p
        </button>

        <button class="price" data-price="100">
          £1
        </button>

        <button class="price" data-price="custom">
          Custom
        </button>

      </div>

      <div id="customPrice">
        <input
          id="price"
          type="number"
          min="1"
          max="999999"
          inputmode="numeric"
          placeholder="Price in pence"
        >
      </div>

    </div>

    <div class="error" id="error"></div>

    <button class="generate" id="generate">
      Generate Barcode
    </button>

  </main>

  <div class="saved-title">
    Saved Barcodes
  </div>

  <div class="empty" id="empty">
    No barcodes generated yet.
  </div>

  <div class="list" id="list"></div>

</div>


<button class="plus" id="plus">+</button>


<!-- CAMERA SCANNER -->

<div class="overlay" id="overlay">

  <div class="scanner">

    <div class="scanner-head">

      <div>
        <h2>Scan Barcode</h2>
        <p>EAN-8 / EAN-13</p>
      </div>

      <button class="close" id="close">
        ×
      </button>

    </div>

    <div class="camera">

      <div id="quagga"></div>

      <div class="target"></div>

    </div>

    <div class="status" id="status">
      Starting camera…
    </div>

    <div class="tip">
      Keep the barcode reasonably close and in focus.
      The scanner continuously analyses the camera feed.
    </div>

  </div>

</div>


<script>

/* Elements */

const $=id=>document.getElementById(id);

const productCode=$("productCode");
const labelInput=$("barcodeLabel");
const priceInput=$("price");
const error=$("error");
const list=$("list");
const empty=$("empty");

let selectedPrice=null;
let scanning=false;
let lastCode="";
let lastCodeTime=0;


/* Accent colours */

const accents=[

  ["#5B5B5B","#FFFFFF"],

  ["#8B2028","#D92838"],
  ["#7A2419","#F04432"],
  ["#8A4B16","#FF8A24"],
  ["#75600D","#E8C51A"],

  ["#39751C","#70E83E"],
  ["#167044","#32E88A"],
  ["#116A6A","#25E0DF"],
  ["#145A86","#28AFFF"],

  ["#273E91","#536FFF"],
  ["#55349B","#965CFF"],
  ["#762C91","#D24CFF"],
  ["#8D2869","#FF4DB8"],

  ["#96304A","#FF4F72"],
  ["#52651A","#B8E631"],
  ["#1E7770","#3DFFD9"],
  ["#5A5A5A","#D5D5D5"]

];

function rgb(hex){

  const n=parseInt(hex.slice(1),16);

  return `${n>>16},${(n>>8)&255},${n&255}`;

}

function setAccent(i){

  const [main,bright]=accents[i];

  document.documentElement.style.setProperty(
    "--accent",
    main
  );

  document.documentElement.style.setProperty(
    "--bright",
    bright
  );

  document.documentElement.style.setProperty(
    "--rgb",
    rgb(bright)
  );

  document.querySelectorAll(".colour").forEach((x,n)=>{
    x.classList.toggle("selected",n===i);
  });

}


/* Build colour picker */

accents.forEach((c,i)=>{

  const button=document.createElement("button");

  button.className="colour";

  button.style.background=c[1];
  button.style.color=c[1];

  button.onclick=()=>{

    setAccent(i);

    $("palette").classList.remove("open");

  };

  $("colours").appendChild(button);

});


/* White default */

setAccent(0);


/* Accent menu */

$("accentButton").onclick=e=>{

  e.stopPropagation();

  $("palette").classList.toggle("open");

};

$("palette").onclick=e=>e.stopPropagation();

document.onclick=()=>{
  $("palette").classList.remove("open");
};


/* Product code limit */

productCode.addEventListener("input",()=>{

  productCode.value=
    productCode.value
      .replace(/\D/g,"")
      .slice(0,13);

});


/* Price buttons */

document.querySelectorAll(".price").forEach(button=>{

  button.onclick=()=>{

    document.querySelectorAll(".price")
      .forEach(x=>x.classList.remove("active"));

    button.classList.add("active");

    const value=button.dataset.price;

    if(value==="custom"){

      selectedPrice=null;

      $("customPrice").style.display="block";

    }else{

      selectedPrice=Number(value);

      priceInput.value=value;

      $("customPrice").style.display="none";

    }

  };

});


/* Check digit */

function checkDigit(input){

  let sum=0;

  for(let i=0;i<input.length;i++){

    const digit=Number(
      input[input.length-1-i]
    );

    sum+=digit*(i%2===0?3:1);

  }

  return (10-(sum%10))%10;

}


/* Generate */

function generateBarcode(){

  error.style.display="none";

  const product=productCode.value.trim();

  const label=labelInput.value.trim();

  const price=
    selectedPrice!==null
      ?selectedPrice
      :Number(priceInput.value);


  const digits=product.replace(/\D/g,"");


  if(digits.length<8){

    error.textContent=
      "Enter a valid barcode of at least 8 digits.";

    error.style.display="block";

    return;

  }


  if(!Number.isFinite(price)||price<1){

    error.textContent=
      "Enter a valid price in pence.";

    error.style.display="block";

    return;

  }


  let productDigits=digits;


  if(productDigits.length===14)
    productDigits=productDigits.slice(0,-1);


  productDigits=
    productDigits
      .padStart(13,"0")
      .slice(0,13);


  const paddedPrice=
    String(price).padStart(6,"0");


  /*
    LABEL IS NOT INCLUDED.
    Only this data is embedded:
    91 + product + price + check digit
  */

  const base=
    `91${productDigits}${paddedPrice}`;

  const full=
    base+checkDigit(base);


  /* Close currently open cards */

  document.querySelectorAll(".card.open")
    .forEach(card=>{
      card.classList.remove("open");
    });


  /* Card */

  const card=document.createElement("div");

  card.className="card open";


  /* Header */

  const head=document.createElement("div");

  head.className="card-head";


  const title=document.createElement("div");

  title.className="label";

  title.textContent=
    label||"Untitled Barcode";


  const data=document.createElement("div");

  data.className="data";

  data.textContent=full;


  head.append(title,data);


  /* Content */

  const content=document.createElement("div");

  content.className="card-content";


  const frame=document.createElement("div");

  frame.className="frame";


  const svg=document.createElementNS(
    "http://www.w3.org/2000/svg",
    "svg"
  );


  frame.appendChild(svg);


  /* Footer */

  const foot=document.createElement("div");

  foot.className="card-foot";


  const remove=document.createElement("button");

  remove.className="remove";

  remove.textContent="Remove";


  remove.onclick=e=>{

    e.stopPropagation();

    card.remove();

    updateEmpty();

  };


  foot.appendChild(remove);


  content.append(frame,foot);

  card.append(head,content);


  /* Open/close */

  card.onclick=()=>{

    document.querySelectorAll(".card.open")
      .forEach(other=>{

        if(other!==card)
          other.classList.remove("open");

      });

    card.classList.toggle("open");

  };


  list.prepend(card);


  /* Render barcode */

  try{

    JsBarcode(svg,full,{

      format:"CODE128",

      displayValue:true,

      fontSize:16,

      width:2,

      height:85,

      margin:5,

      background:"#fff",

      lineColor:"#111",

      fontOptions:"bold"

    });

  }catch(e){

    frame.textContent=
      "Barcode rendering failed.";

  }


  /* Reset */

  labelInput.value="";
  productCode.value="";

  updateEmpty();


  /* Show newest barcode */

  card.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


/* Generate button */

$("generate").onclick=generateBarcode;


/* Plus */

$("plus").onclick=()=>{

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  setTimeout(()=>{
    labelInput.focus();
  },350);

};


/* Empty state */

function updateEmpty(){

  empty.style.display=
    list.children.length
      ?"none"
      :"block";

}

updateEmpty();


/* =========================
   QUAGGA2 CAMERA SCANNER
   ========================= */

function openScanner(){

  $("overlay").classList.add("open");

  $("status").textContent=
    "Requesting camera…";

  $("status").className="status";

  startScanner();

}


function startScanner(){

  if(typeof Quagga==="undefined"){

    $("status").textContent=
      "Scanner library failed to load.";

    $("status").className=
      "status error";

    return;

  }


  if(
    !navigator.mediaDevices||
    !navigator.mediaDevices.getUserMedia
  ){

    $("status").textContent=
      "This browser cannot access the camera.";

    $("status").className=
      "status error";

    return;

  }


  scanning=true;


  Quagga.init({

    inputStream:{

      name:"Live",

      type:"LiveStream",

      target:
        document.querySelector("#quagga"),

      constraints:{

        facingMode:{
          ideal:"environment"
        },

        width:{
          min:640,
          ideal:1280,
          max:1920
        },

        height:{
          min:480,
          ideal:720,
          max:1080
        }

      },

      area:{

        top:"10%",
        right:"5%",
        left:"5%",
        bottom:"10%"

      }

    },


    locator:{

      patchSize:"medium",

      halfSample:false

    },


    frequency:30,


    numOfWorkers:2,


    locate:true,


    decoder:{

      readers:[

        "ean_reader",

        "ean_8_reader"

      ],

      multiple:false

    },


    debug:{

      drawBoundingBox:false,

      showFrequency:false,

      drawScanline:false,

      showPattern:false

    }

  },err=>{


    if(err){

      console.error(err);

      scanning=false;

      $("status").textContent=
        cameraError(err);

      $("status").className=
        "status error";

      return;

    }


    $("status").textContent=
      "Camera ready — point it at a barcode.";


    Quagga.start();


    /* Attempt continuous autofocus */

    setTimeout(()=>{

      try{

        const video=
          document.querySelector(
            "#quagga video"
          );

        const track=
          video?.srcObject
            ?.getVideoTracks?.()[0];


        if(track?.getCapabilities){

          const caps=
            track.getCapabilities();


          if(
            caps.focusMode?.includes(
              "continuous"
            )
          ){

            track.applyConstraints({

              advanced:[
                {
                  focusMode:"continuous"
                }
              ]

            }).catch(()=>{});

          }

        }

      }catch(e){}

    },500);

  });

}


/* Detection */

Quagga.onDetected(result=>{

  if(
    !scanning||
    !result?.codeResult?.code
  )
    return;


  const code=
    String(result.codeResult.code)
      .replace(/\D/g,"");


  const format=
    result.codeResult.format;


  if(
    (format!=="ean_13"&&
     format!=="ean_8")||
    (code.length!==8&&
     code.length!==13)
  ){

    return;

  }


  /*
    Require repeated detection
    before accepting the result.
  */

  const now=Date.now();


  if(code!==lastCode){

    lastCode=code;

    lastCodeTime=now;

    return;

  }


  if(now-lastCodeTime<100)
    return;


  scanning=false;


  productCode.value=
    code.slice(0,13);


  $("status").textContent=
    "✓ Barcode detected";


  $("status").className=
    "status success";


  setTimeout(
    closeScanner,
    250
  );

});


/* Camera errors */

function cameraError(err){

  const text=
    String(err||"").toLowerCase();


  if(
    text.includes("permission")||
    text.includes("notallowed")
  ){

    return(
      "Camera permission was denied. " +
      "Allow camera access for this website."
    );

  }


  if(text.includes("notfound")){

    return "No camera was found.";

  }


  if(
    location.protocol!=="https:"&&
    location.hostname!=="localhost"
  ){

    return(
      "Camera access requires HTTPS."
    );

  }


  return(
    "Could not start the camera. " +
    "Check your browser camera permission."
  );

}


/* Close scanner */

function closeScanner(){

  scanning=false;


  try{

    if(typeof Quagga!=="undefined"){

      Quagga.stop();

      Quagga.offDetected();

    }

  }catch(e){}


  $("quagga").innerHTML="";

  $("overlay").classList.remove("open");


  lastCode="";

  lastCodeTime=0;

}


/* Scanner controls */

$("scanButton").onclick=
  openScanner;


$("close").onclick=
  closeScanner;


$("overlay").onclick=e=>{

  if(e.target===$("overlay"))
    closeScanner();

};


document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.hidden&&
      scanning
    ){

      closeScanner();

    }

  }
);


document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="Escape"&&
      $("overlay").classList.contains("open")
    ){

      closeScanner();

    }

  }
);

</script>
