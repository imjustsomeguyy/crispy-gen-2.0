<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3A3A3A">

<title>PLACEHOLDER1</title>

<!-- Barcode generator -->
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<!-- Camera scanner -->
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>

<style>
:root {
  --bg: #3A3A3A;
  --card: #4A4A4A;
  --input: #3A3A3A;
  --border: #5B5B5B;
  --border2: #6C6C6C;
  --text: #EEEEEE;
  --muted: #AAAAAA;

  --accent: #5B5B5B;
  --bright: #FFFFFF;
  --rgb: 255,255,255;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px 14px 100px;
  overflow-x: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  color: var(--text);

  background:
    radial-gradient(
      circle at 50% -20%,
      #6C6C6C 0%,
      #4A4A4A 32%,
      #3A3A3A 70%,
      #303030 100%
    );
}

button,
input {
  font: inherit;
}

button {
  touch-action: manipulation;
}

.app {
  width: min(520px, 100%);
  margin: auto;
}


/* =========================
   ACCENT COLOUR PICKER
========================= */

.top {
  height: 36px;
  display: flex;
  justify-content: flex-end;
  position: relative;
  margin-bottom: 2px;
}

.accent-btn {
  width: 32px;
  height: 32px;

  border: 1px solid var(--border2);
  border-radius: 9px;

  background: var(--input);

  cursor: pointer;

  box-shadow:
    0 0 9px rgba(var(--rgb), 0.3);
}

.accent-dot {
  display: block;

  width: 12px;
  height: 12px;

  margin: auto;

  border-radius: 50%;

  background: var(--bright);

  box-shadow:
    0 0 5px var(--bright),
    0 0 13px var(--bright);
}

.palette {
  display: none;

  position: absolute;
  right: 0;
  top: 40px;

  z-index: 100;

  width: 190px;

  padding: 12px;

  border: 1px solid var(--border2);
  border-radius: 13px;

  background: #3A3A3A;

  box-shadow:
    0 18px 50px #00000099;
}

.palette.open {
  display: block;
}

.palette-title {
  margin-bottom: 9px;

  color: var(--muted);

  font-size: 10px;
  font-weight: bold;

  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.colours {
  display: grid;

  grid-template-columns: repeat(4, 1fr);

  gap: 8px;
}

.colour {
  width: 32px;
  height: 32px;

  padding: 0;

  border: 2px solid transparent;
  border-radius: 9px;

  cursor: pointer;
}

.colour.selected {
  border-color: white;

  box-shadow:
    0 0 8px currentColor,
    0 0 14px currentColor;
}


/* =========================
   HEADER
========================= */

header {
  text-align: center;
  margin-bottom: 20px;
}

h1 {
  margin: 0;

  font-size: 25px;

  letter-spacing: -0.5px;

  text-shadow:
    0 0 12px rgba(var(--rgb), 0.3);
}

header p {
  margin: 7px 0 0;

  color: var(--muted);

  font-size: 13px;
}


/* =========================
   GENERATOR
========================= */

.generator {
  padding: 20px;

  border: 1px solid var(--border2);
  border-radius: 22px;

  background: var(--card);

  box-shadow:
    0 25px 60px #00000055,
    inset 0 1px #ffffff08;
}

.field {
  margin-bottom: 16px;
}

label {
  display: block;

  margin-bottom: 7px;

  color: #B8B8B8;

  font-size: 10px;
  font-weight: 750;

  text-transform: uppercase;
  letter-spacing: 0.8px;
}

input {
  width: 100%;
  height: 50px;

  padding: 0 15px;

  border: 1px solid var(--border2);
  border-radius: 13px;

  outline: none;

  background: var(--input);
  color: var(--text);

  font-size: 16px;
}

input::placeholder {
  color: #858585;
}

input:focus {
  border-color: var(--bright);

  box-shadow:
    0 0 0 3px rgba(var(--rgb), 0.12),
    0 0 14px rgba(var(--rgb), 0.12);
}

.code-row {
  display: flex;
  gap: 9px;
}

.code-row input {
  flex: 1;
  min-width: 0;
}

.scan {
  width: 56px;
  height: 50px;

  flex-shrink: 0;

  border: 1px solid var(--border2);
  border-radius: 13px;

  background: var(--accent);
  color: white;

  font-size: 23px;

  cursor: pointer;

  box-shadow:
    0 0 10px rgba(var(--rgb), 0.25);
}

.scan:active {
  transform: scale(0.96);
}


/* =========================
   SWIPE PRICE
========================= */

.price-field {
  margin-bottom: 17px;
}

.price-swipe {
  position: relative;

  width: 100%;
  height: 82px;

  overflow: hidden;

  border: 1px solid var(--border2);
  border-radius: 16px;

  background:
    linear-gradient(
      145deg,
      var(--input),
      #343434
    );

  cursor: ew-resize;

  user-select: none;
  -webkit-user-select: none;

  touch-action: pan-y;

  box-shadow:
    inset 0 1px #ffffff07,
    0 7px 18px #00000022;
}

.price-swipe.dragging {
  border-color: var(--bright);

  box-shadow:
    inset 0 1px #ffffff0b,
    0 0 18px rgba(var(--rgb), 0.28);
}

.price-content {
  position: absolute;
  inset: 0;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  pointer-events: none;
}

.price-small {
  margin-bottom: 2px;

  color: var(--muted);

  font-size: 10px;
  font-weight: bold;

  text-transform: uppercase;
  letter-spacing: 1px;
}

.price-value {
  font-size: 27px;
  font-weight: 800;

  letter-spacing: -0.5px;

  text-shadow:
    0 0 10px rgba(var(--rgb), 0.18);
}

.swipe-arrow {
  position: absolute;

  top: 50%;

  transform: translateY(-50%);

  color: #777;

  font-size: 19px;

  opacity: 0.65;

  pointer-events: none;
}

.swipe-arrow.left {
  left: 15px;
}

.swipe-arrow.right {
  right: 15px;
}

.price-swipe.changed {
  border-color: var(--bright);
}

.price-swipe.changed .price-value {
  text-shadow:
    0 0 5px var(--bright),
    0 0 15px rgba(var(--rgb), 0.55);
}


/* =========================
   QUICK PRICE BUTTONS
========================= */

.quick-prices {
  display: flex;

  gap: 8px;

  margin-top: 10px;
}

.quick-price {
  flex: 1;

  height: 38px;

  border: 1px solid var(--border2);
  border-radius: 11px;

  background: var(--input);
  color: var(--text);

  font-size: 13px;
  font-weight: 700;

  cursor: pointer;

  transition:
    transform 0.12s ease,
    border-color 0.15s ease,
    box-shadow 0.15s ease;
}

.quick-price:active {
  transform: scale(0.96);
}

.quick-price:hover {
  border-color: var(--bright);

  box-shadow:
    0 0 10px rgba(var(--rgb), 0.25);
}


/* =========================
   GENERATE BUTTON
========================= */

.generate {
  width: 100%;
  height: 51px;

  border: 1px solid var(--bright);
  border-radius: 13px;

  background: var(--accent);
  color: white;

  font-size: 15px;
  font-weight: 800;

  cursor: pointer;

  box-shadow:
    0 0 9px rgba(var(--rgb), 0.4);
}

.generate:active {
  transform: scale(0.985);
}

.generate:hover {
  box-shadow:
    0 0 17px rgba(var(--rgb), 0.65);
}

.error {
  display: none;

  margin: 0 0 12px;

  color: #FF5967;

  font-size: 13px;
}


/* =========================
   SAVED BARCODES
========================= */

.saved-title {
  margin: 28px 0 10px;

  color: var(--muted);

  text-align: center;

  font-size: 10px;
  font-weight: bold;

  letter-spacing: 1px;

  text-transform: uppercase;
}

.empty {
  padding: 27px 15px;

  border: 1px dashed var(--border2);
  border-radius: 17px;

  color: var(--muted);

  text-align: center;

  font-size: 13px;
}

.list {
  display: flex;

  flex-direction: column;

  gap: 13px;
}


/* =========================
   BARCODE CARDS
========================= */

.card {
  position: relative;

  overflow: hidden;

  border: 1px solid var(--border2);
  border-radius: 20px;

  background: var(--card);

  box-shadow:
    0 12px 30px #00000044;

  cursor: pointer;
}

.card-head {
  position: relative;

  min-height: 72px;

  display: grid;

  place-items: center;

  padding: 13px 55px;

  text-align: center;
}

.card-head::after {
  content: "⌄";

  position: absolute;

  right: 17px;
  top: 50%;

  transform: translateY(-50%);

  color: #999;

  font-size: 19px;

  transition:
    transform 0.25s ease;
}

.card.open .card-head::after {
  transform:
    translateY(-50%)
    rotate(180deg);
}

.card-head-label,
.card-head-price {
  width: 100%;

  text-align: center;
}

.card-head-label {
  font-size: 15px;
  font-weight: 700;
}

.card-head-price {
  margin-top: 3px;

  color: #AAAAAA;

  font-size: 12px;
}

.card-content {
  display: none;

  padding-bottom: 4px;
}

.card.open .card-content {
  display: block;
}

.frame {
  margin: 0 12px;

  padding: 16px 10px 15px;

  border-radius: 16px;

  background: #EEF1F0;

  box-shadow:
    inset 0 1px #FFFFFF;
}

.frame svg {
  display: block;

  width: 100%;
  height: auto;

  margin: auto;
}

.barcode-data {
  margin-top: 8px;

  color: #6C7571;

  text-align: center;

  font-size: 9px;

  letter-spacing: 0.4px;

  word-break: break-all;
}

.card-foot {
  padding: 11px 15px 13px;

  text-align: center;
}

.remove {
  padding: 7px 15px;

  border: 1px solid var(--border2);
  border-radius: 9px;

  background: var(--input);
  color: #FF5967;

  font-size: 12px;

  cursor: pointer;
}

.remove:active {
  transform: scale(0.96);
}


/* =========================
   FLOATING PLUS BUTTON
========================= */

.plus {
  position: fixed;

  right: 22px;
  bottom: 22px;

  z-index: 30;

  width: 56px;
  height: 56px;

  border: 1px solid var(--bright);
  border-radius: 50%;

  background: var(--accent);
  color: white;

  font-size: 30px;
  line-height: 1;

  cursor: pointer;

  box-shadow:
    0 0 12px rgba(var(--rgb), 0.5),
    0 12px 30px #00000077;
}

.plus:active {
  transform: scale(0.94);
}


/* =========================
   SCANNER
========================= */

.overlay {
  display: none;

  position: fixed;
  inset: 0;

  z-index: 999;

  align-items: center;
  justify-content: center;

  padding: 14px;

  background: #000000DD;

  backdrop-filter: blur(8px);
}

.overlay.open {
  display: flex;
}

.scanner {
  width: min(520px, 100%);

  overflow: hidden;

  border: 1px solid var(--border2);
  border-radius: 20px;

  background: #3A3A3A;

  box-shadow:
    0 30px 90px #000000;
}

.scanner-head {
  display: flex;

  align-items: flex-start;
  justify-content: space-between;

  padding: 17px;
}

.scanner-head h2 {
  margin: 0;

  font-size: 18px;
}

.scanner-head p {
  margin: 5px 0 0;

  color: #AAAAAA;

  font-size: 12px;
}

.close {
  width: 38px;
  height: 38px;

  border: 1px solid var(--border);
  border-radius: 11px;

  background: var(--card);
  color: #DDDDDD;

  font-size: 24px;

  cursor: pointer;
}

.camera {
  position: relative;

  width: calc(100% - 24px);
  height: 330px;

  margin: 0 12px;

  overflow: hidden;

  border: 1px solid var(--border);
  border-radius: 14px;

  background: #000000;
}

#quagga {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;
}

#quagga video {
  display: block;

  width: 100% !important;
  height: 100% !important;

  object-fit: cover;
}

#quagga canvas {
  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;
}

.target {
  position: absolute;

  left: 5%;
  right: 5%;

  top: 50%;

  height: 110px;

  transform: translateY(-50%);

  border: 2px solid #FFFFFF99;
  border-radius: 10px;

  pointer-events: none;

  box-shadow:
    0 0 0 9999px #00000022;
}

.target::after {
  content: "";

  position: absolute;

  left: 4%;
  right: 4%;

  top: 50%;

  height: 2px;

  background: #FFFFFF;

  box-shadow:
    0 0 8px #FFFFFF;
}

.status {
  min-height: 21px;

  padding: 12px 17px 5px;

  color: #AAAAAA;

  text-align: center;

  font-size: 13px;
}

.status.success {
  color: var(--bright);

  font-weight: bold;

  text-shadow:
    0 0 9px rgba(var(--rgb), 0.7);
}

.status.error {
  color: #FF5967;
}

.tip {
  padding: 5px 17px 16px;

  color: #858585;

  font-size: 11px;

  text-align: center;
}


@media (max-width: 430px) {

  body {
    padding-left: 10px;
    padding-right: 10px;
  }

  .generator {
    padding: 16px;
  }

  .plus {
    right: 16px;
    bottom: 16px;
  }

  .camera {
    height: 300px;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- Accent picker -->

  <div class="top">

    <button
      class="accent-btn"
      id="accentButton"
      aria-label="Change accent colour"
    >
      <span class="accent-dot"></span>
    </button>

    <div
      class="palette"
      id="palette"
    >
      <div class="palette-title">
        Accent colour
      </div>

      <div
        class="colours"
        id="colours"
      ></div>
    </div>

  </div>


  <!-- Header -->

  <header>
    <h1>PLACEHOLDER1</h1>
    <p>PLACEHOLDER2</p>
  </header>


  <!-- Generator -->

  <main class="generator">

    <div class="field">

      <label for="productCode">
        Barcode
      </label>

      <div class="code-row">

        <input
          id="productCode"
          type="text"
          maxlength="13"
          inputmode="numeric"
          placeholder="Enter barcode number"
          autocomplete="off"
        >

        <button
          class="scan"
          id="scanButton"
          title="Scan barcode"
          aria-label="Scan barcode"
        >
          📷
        </button>

      </div>

    </div>


    <!-- Label -->

    <div class="field">

      <label for="barcodeLabel">
        Label
      </label>

      <input
        id="barcodeLabel"
        type="text"
        placeholder="Add a label to your barcode"
        autocomplete="off"
      >

    </div>


    <!-- Price -->

    <div class="price-field">

      <label>
        Price
      </label>

      <div
        class="price-swipe"
        id="priceSwipe"
      >

        <div class="swipe-arrow left">
          ←
        </div>

        <div class="swipe-arrow right">
          →
        </div>

        <div class="price-content">

          <div class="price-small">
            Swipe to adjust
          </div>

          <div
            class="price-value"
            id="priceValue"
          >
            10p
          </div>

        </div>

      </div>


      <!-- Quick price buttons -->

      <div class="quick-prices">

        <button
          class="quick-price"
          data-price="15"
        >
          15p
        </button>

        <button
          class="quick-price"
          data-price="20"
        >
          20p
        </button>

        <button
          class="quick-price"
          data-price="50"
        >
          50p
        </button>

      </div>

    </div>


    <div
      class="error"
      id="error"
    ></div>


    <button
      class="generate"
      id="generate"
    >
      Generate Barcode
    </button>

  </main>


  <!-- Saved -->

  <div class="saved-title">
    Saved Barcodes
  </div>


  <div
    class="empty"
    id="empty"
  >
    No barcodes generated yet.
  </div>


  <div
    class="list"
    id="list"
  ></div>

</div>


<!-- Floating plus -->

<button
  class="plus"
  id="plus"
  aria-label="Create another barcode"
>
  +
</button>


<!-- Scanner -->

<div
  class="overlay"
  id="overlay"
>

  <div class="scanner">

    <div class="scanner-head">

      <div>
        <h2>Scan Barcode</h2>
        <p>EAN-8 / EAN-13</p>
      </div>

      <button
        class="close"
        id="close"
        aria-label="Close scanner"
      >
        ×
      </button>

    </div>


    <div class="camera">

      <div id="quagga"></div>

      <div class="target"></div>

    </div>


    <div
      class="status"
      id="status"
    >
      Starting camera…
    </div>


    <div class="tip">
      Keep the barcode in focus and inside the box.
      Move slowly if scanning a curved surface.
    </div>

  </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const $ = id => document.getElementById(id);

const productCode = $("productCode");
const labelInput = $("barcodeLabel");
const errorBox = $("error");
const list = $("list");
const empty = $("empty");

const priceSwipe = $("priceSwipe");
const priceValue = $("priceValue");

let scanning = false;
let lastCode = "";
let lastCodeTime = 0;


/* =========================
   ACCENT COLOURS
========================= */

const accents = [

  ["#5B5B5B", "#FFFFFF"],

  ["#8B2028", "#D92838"],
  ["#7A2419", "#F04432"],
  ["#8A4B16", "#FF8A24"],
  ["#75600D", "#E8C51A"],

  ["#39751C", "#70E83E"],
  ["#167044", "#32E88A"],
  ["#116A6A", "#25E0DF"],
  ["#145A86", "#28AFFF"],

  ["#273E91", "#536FFF"],
  ["#55349B", "#965CFF"],
  ["#762C91", "#D24CFF"],
  ["#8D2869", "#FF4DB8"],

  ["#96304A", "#FF4F72"],
  ["#52651A", "#B8E631"],
  ["#1E7770", "#3DFFD9"]

];


function rgb(hex) {

  const number =
    parseInt(hex.slice(1), 16);

  return `
    ${number >> 16},
    ${(number >> 8) & 255},
    ${number & 255}
  `.replace(/\s/g, "");

}


function setAccent(index) {

  const [main, bright] =
    accents[index];

  document.documentElement.style.setProperty(
    "--accent",
    main
  );

  document.documentElement.style.setProperty(
    "--bright",
    bright
  );

  document.documentElement.style.setProperty(
    "--rgb",
    rgb(bright)
  );

  document
    .querySelectorAll(".colour")
    .forEach((element, i) => {

      element.classList.toggle(
        "selected",
        i === index
      );

    });

}


/* Build palette */

accents.forEach((colour, index) => {

  const button =
    document.createElement("button");

  button.className =
    "colour";

  button.style.background =
    colour[1];

  button.style.color =
    colour[1];

  button.onclick = () => {

    setAccent(index);

    $("palette")
      .classList.remove("open");

  };

  $("colours")
    .appendChild(button);

});


/* Default white */

setAccent(0);


/* Palette */

$("accentButton").onclick =
  event => {

    event.stopPropagation();

    $("palette")
      .classList.toggle("open");

  };


$("palette").onclick =
  event => {

    event.stopPropagation();

  };


document.addEventListener(
  "click",
  () => {

    $("palette")
      .classList.remove("open");

  }
);


/* =========================
   BARCODE INPUT
========================= */

productCode.addEventListener(
  "input",
  () => {

    productCode.value =
      productCode.value
        .replace(/\D/g, "")
        .slice(0, 13);

  }
);


/* =========================
   PRICE SYSTEM
========================= */

let pricePence = 10;

let dragStartX = 0;
let dragStartPrice = 10;
let dragging = false;


/* Price display */

function formatPrice(pence) {

  pence =
    Math.max(
      10,
      Math.round(pence)
    );

  if (pence < 100) {

    return `${pence}p`;

  }

  const pounds =
    Math.floor(pence / 100);

  const pennies =
    pence % 100;

  if (pennies === 0) {

    return `£${pounds}`;

  }

  return (
    `£${pounds}.` +
    String(pennies).padStart(2, "0")
  );

}


/* Update price */

function updatePrice() {

  pricePence =
    Math.max(
      10,
      Math.round(pricePence)
    );

  priceValue.textContent =
    formatPrice(pricePence);

  priceSwipe.classList.add(
    "changed"
  );

  clearTimeout(
    updatePrice.flashTimer
  );

  updatePrice.flashTimer =
    setTimeout(() => {

      priceSwipe.classList.remove(
        "changed"
      );

    }, 120);

}


updatePrice();


/* Quick prices */

document
  .querySelectorAll(".quick-price")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        pricePence =
          Number(
            button.dataset.price
          );

        updatePrice();

      }
    );

  });


/* Swipe start */

priceSwipe.addEventListener(
  "pointerdown",
  event => {

    dragging = true;

    dragStartX =
      event.clientX;

    dragStartPrice =
      pricePence;

    priceSwipe.classList.add(
      "dragging"
    );

    try {

      priceSwipe.setPointerCapture(
        event.pointerId
      );

    } catch (e) {}

  }
);


/* Swipe movement */

priceSwipe.addEventListener(
  "pointermove",
  event => {

    if (!dragging)
      return;

    const rect =
      priceSwipe.getBoundingClientRect();

    const width =
      Math.max(
        rect.width,
        1
      );

    const moved =
      event.clientX -
      dragStartX;


    /*
      Full swipe ≈ 35p
    */

    const change =
      (moved / width) * 35;


    pricePence =
      Math.max(
        10,
        Math.round(
          dragStartPrice + change
        )
      );


    updatePrice();

  }
);


function stopPriceDrag() {

  if (!dragging)
    return;

  dragging = false;

  priceSwipe.classList.remove(
    "dragging"
  );

}


priceSwipe.addEventListener(
  "pointerup",
  stopPriceDrag
);

priceSwipe.addEventListener(
  "pointercancel",
  stopPriceDrag
);


/* =========================
   CHECK DIGIT
========================= */

function checkDigit(input) {

  let sum = 0;

  for (
    let i = 0;
    i < input.length;
    i++
  ) {

    const digit =
      Number(
        input[
          input.length - 1 - i
        ]
      );

    sum += digit *
      (
        i % 2 === 0
          ? 3
          : 1
      );

  }

  return (
    10 -
    (sum % 10)
  ) % 10;

}


/* =========================
   GENERATE BARCODE
========================= */

function generateBarcode() {

  errorBox.style.display =
    "none";


  const rawProduct =
    productCode.value.trim();

  const label =
    labelInput.value.trim();

  const digits =
    rawProduct.replace(/\D/g, "");


  if (digits.length < 8) {

    errorBox.textContent =
      "Enter a valid barcode of at least 8 digits.";

    errorBox.style.display =
      "block";

    return;

  }


  let productDigits =
    digits;

  if (productDigits.length === 14) {

    productDigits =
      productDigits.slice(0, -1);

  }


  productDigits =
    productDigits
      .padStart(13, "0")
      .slice(0, 13);


  const paddedPrice =
    String(pricePence)
      .padStart(6, "0");


  /*
    Barcode data:

    91 prefix
    Product digits
    Price in pence
    Check digit

    Label is NOT included.
  */

  const base =
    `91${productDigits}${paddedPrice}`;

  const fullBarcode =
    base +
    checkDigit(base);


  /* Close other cards */

  document
    .querySelectorAll(".card.open")
    .forEach(card => {

      card.classList.remove(
        "open"
      );

    });


  /* Card */

  const card =
    document.createElement("div");

  card.className =
    "card open";


  /* Header */

  const head =
    document.createElement("div");

  head.className =
    "card-head";


  const cardLabel =
    document.createElement("div");

  cardLabel.className =
    "card-head-label";

  cardLabel.textContent =
    label ||
    "Untitled Barcode";


  const cardPrice =
    document.createElement("div");

  cardPrice.className =
    "card-head-price";

  cardPrice.textContent =
    formatPrice(pricePence);


  head.append(
    cardLabel,
    cardPrice
  );


  /* Content */

  const content =
    document.createElement("div");

  content.className =
    "card-content";


  const frame =
    document.createElement("div");

  frame.className =
    "frame";


  const svg =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "svg"
    );

  frame.appendChild(svg);


  /* Barcode number appears once */

  const barcodeData =
    document.createElement("div");

  barcodeData.className =
    "barcode-data";

  barcodeData.textContent =
    fullBarcode;

  frame.appendChild(
    barcodeData
  );


  /* Footer */

  const foot =
    document.createElement("div");

  foot.className =
    "card-foot";


  const remove =
    document.createElement("button");

  remove.className =
    "remove";

  remove.textContent =
    "Remove";


  remove.onclick =
    event => {

      event.stopPropagation();

      card.remove();

      updateEmpty();

    };


  foot.appendChild(
    remove
  );


  content.append(
    frame,
    foot
  );


  card.append(
    head,
    content
  );


  /* Accordion */

  card.onclick = () => {

    const wasOpen =
      card.classList.contains(
        "open"
      );


    document
      .querySelectorAll(".card.open")
      .forEach(other => {

        other.classList.remove(
          "open"
        );

      });


    if (!wasOpen) {

      card.classList.add(
        "open"
      );

    }

  };


  list.prepend(card);


  /* Draw barcode */

  try {

    JsBarcode(
      svg,
      fullBarcode,
      {

        format: "CODE128",

        displayValue: false,

        width: 2,

        height: 100,

        margin: 6,

        background: "#EEF1F0",

        lineColor: "#111111"

      }
    );

  } catch (renderError) {

    console.error(renderError);

    frame.textContent =
      "Barcode rendering failed.";

  }


  /* Reset fields */

  labelInput.value = "";
  productCode.value = "";


  updateEmpty();


  setTimeout(() => {

    card.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

  }, 80);

}


/* Generate */

$("generate").onclick =
  generateBarcode;


/* Enter */

productCode.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      generateBarcode();

    }

  }
);


/* =========================
   PLUS BUTTON
========================= */

$("plus").onclick = () => {

  });

/* =========================
   EMPTY STATE
========================= */

function updateEmpty() {

  empty.style.display =
    list.children.length
      ? "none"
      : "block";

}

updateEmpty();


/* =========================
   CAMERA SCANNER
========================= */

function openScanner() {

  $("overlay")
    .classList.add("open");

  $("status").textContent =
    "Requesting camera…";

  $("status").className =
    "status";


  setTimeout(
    startScanner,
    100
  );

}


function startScanner() {

  if (
    typeof Quagga ===
    "undefined"
  ) {

    $("status").textContent =
      "Scanner library failed to load.";

    $("status").className =
      "status error";

    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    $("status").textContent =
      "This browser cannot access the camera.";

    $("status").className =
      "status error";

    return;

  }


  scanning = true;


  Quagga.init({

    inputStream: {

      name: "Live",

      type: "LiveStream",

      target:
        document.querySelector(
          "#quagga"
        ),

      constraints: {

        facingMode: {
          ideal: "environment"
        },

        width: {
          min: 640,
          ideal: 1280,
          max: 1920
        },

        height: {
          min: 480,
          ideal: 720,
          max: 1080
        }

      },

      area: {

        top: "8%",
        right: "4%",
        left: "4%",
        bottom: "8%"

      }

    },


    locator: {

      patchSize: "medium",

      halfSample: false

    },


    frequency: 25,

    numOfWorkers: 2,

    locate: true,


    decoder: {

      readers: [

        "ean_reader",

        "ean_8_reader"

      ],

      multiple: false

    }

  }, initError => {

    if (initError) {

      console.error(
        "Scanner error:",
        initError
      );

      scanning = false;

      $("status").textContent =
        cameraError(initError);

      $("status").className =
        "status error";

      return;

    }


    $("status").textContent =
      "Camera ready — point it at a barcode.";


    Quagga.start();


    /* Try continuous autofocus */

    setTimeout(() => {

      try {

        const video =
          document.querySelector(
            "#quagga video"
          );

        const track =
          video?.srcObject
            ?.getVideoTracks?.()[0];


        if (
          track &&
          track.getCapabilities
        ) {

          const capabilities =
            track.getCapabilities();


          if (
            capabilities.focusMode &&
            capabilities.focusMode.includes(
              "continuous"
            )
          ) {

            track
              .applyConstraints({
                advanced: [
                  {
                    focusMode:
                      "continuous"
                  }
                ]
              })
              .catch(() => {});

          }

        }

      } catch (e) {}

    }, 700);

  });

}


/* =========================
   DETECTION
========================= */

Quagga.onDetected(
  result => {

    if (
      !scanning ||
      !result ||
      !result.codeResult ||
      !result.codeResult.code
    ) {
      return;
    }


    const code =
      String(
        result.codeResult.code
      )
        .replace(/\D/g, "");


    const format =
      result.codeResult.format;


    if (
      format !== "ean_13" &&
      format !== "ean_8"
    ) {
      return;
    }


    if (
      code.length !== 8 &&
      code.length !== 13
    ) {
      return;
    }


    const now =
      Date.now();


    /* Require repeat detection */

    if (
      code !== lastCode
    ) {

      lastCode =
        code;

      lastCodeTime =
        now;

      return;

    }


    if (
      now - lastCodeTime < 80
    ) {
      return;
    }


    scanning = false;


    productCode.value =
      code.slice(0, 13);


    $("status").textContent =
      "✓ Barcode detected";


    $("status").className =
      "status success";


    setTimeout(
      closeScanner,
      350
    );

  }
);


/* =========================
   CAMERA ERRORS
========================= */

function cameraError(err) {

  const text =
    String(err || "")
      .toLowerCase();


  if (
    text.includes("permission") ||
    text.includes("notallowed") ||
    text.includes("denied")
  ) {

    return (
      "Camera permission was denied. " +
      "Allow camera access for this website."
    );

  }


  if (
    text.includes("notfound")
  ) {

    return (
      "No camera was found."
    );

  }


  if (
    location.protocol !== "https:" &&
    location.hostname !== "localhost"
  ) {

    return (
      "Camera access requires HTTPS."
    );

  }


  return (
    "Could not start the camera. " +
    "Check browser camera permissions."
  );

}


/* =========================
   CLOSE SCANNER
========================= */

function closeScanner() {

  scanning = false;


  try {

    if (
      typeof Quagga !==
      "undefined"
    ) {

      Quagga.stop();

    }

  } catch (e) {}


  $("quagga").innerHTML =
    "";


  $("overlay")
    .classList.remove("open");


  lastCode = "";
  lastCodeTime = 0;

}


/* Scanner buttons */

$("scanButton").onclick =
  openScanner;


$("close").onclick =
  closeScanner;


$("overlay").onclick =
  event => {

    if (
      event.target ===
      $("overlay")
    ) {

      closeScanner();

    }

  };


/* Stop camera when app is hidden */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.hidden &&
      scanning
    ) {

      closeScanner();

    }

  }
);


/* Escape closes scanner */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape" &&
      $("overlay")
        .classList.contains("open")
    ) {

      closeScanner();

    }

  }
);

</script>
